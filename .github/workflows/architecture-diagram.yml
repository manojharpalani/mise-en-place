name: Architecture diagram

on:
  push:
    branches: [main]
    paths:
      - "architecture/workspace.dsl"
  pull_request:
    paths:
      - "architecture/workspace.dsl"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Render diagrams
        run: ./architecture/generate.sh

      - name: Commit updated diagrams
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add architecture/diagrams
          if ! git diff --cached --quiet; then
            git commit -m "chore(architecture): regenerate diagrams from workspace.dsl [skip ci]"
            git push
          else
            echo "No diagram changes to commit."
          fi

      - name: Fail PR if diagrams are stale
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- architecture/diagrams; then
            echo "::error::architecture/diagrams is out of date with workspace.dsl. Run ./architecture/generate.sh and commit the result."
            git diff --stat -- architecture/diagrams
            exit 1
          fi
